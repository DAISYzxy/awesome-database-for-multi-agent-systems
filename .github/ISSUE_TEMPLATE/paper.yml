name: Recommend a paper
description: Suggest a paper on database and data-system support for multi-agent collaboration.
title: "[Paper] "
body:
  - type: input
    id: paper-title
    attributes:
      label: Paper title
    validations:
      required: true
  - type: input
    id: paper-url
    attributes:
      label: Paper link
      description: An official publication page, DOI, or author-hosted preprint.
      placeholder: https://doi.org/...
    validations:
      required: true
  - type: input
    id: venue-year
    attributes:
      label: Venue and year
      description: Provide the verified DB venue and publication year; identify workshops separately.
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Classification (layer / data perspective / topic)
      description: Select the primary category from the README topic classification table.
      options:
        - "Planning / Data Management / Task Decomposition and Sharing"
        - "Planning / Data Preparation / Agent Role and Dependency Extraction"
        - "Planning / Data Analysis / Task Reuse Analysis"
        - "Execution / Data Management / Workflow Optimization"
        - "Execution / Data Management / Communication Optimization"
        - "Execution / Data Preparation / Inter-Agent Data Contracts"
        - "Execution / Data Analysis / Cost and Quality Estimation"
        - "Execution / Data Analysis / Error Propagation Analysis"
        - "Action / Data Management / Compensation and Recovery"
        - "Action / Data Analysis / Recovery Analysis"
        - "Memory / Data Management / Shared Memory Management"
        - "Memory / Data Management / State Management"
        - "Memory / Data Management / Semantic Caching"
        - "Memory / Data Preparation / Context Compression"
        - "Memory / Data Preparation / Log Structuring"
        - "Memory / Data Analysis / State Consistency Analysis"
        - "Data Interface / Data Management / Concurrency Control"
        - "Inference Infrastructure / Data Management / KV Cache Management"
        - "Inference Infrastructure / Data Management / Inference and Data Scheduling"
        - "Inference Infrastructure / Data Analysis / Cache Cost and Efficiency Analysis"
    validations:
      required: true
  - type: textarea
    id: relevance
    attributes:
      label: Relevance to Database for Multi-Agent Systems
      description: Identify the collaborating agents, the data-system mechanism that improves their collaboration, and the exact primary-source section. Identify the topic for this mechanism and any additional cross-layer mechanisms with evidence; a data-task application alone is insufficient.
    validations:
      required: true
  - type: input
    id: code-url
    attributes:
      label: Code or project link
      description: Optional.
